<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1750" viewBox="0 0 1100 1750"><rect width="1100" height="1750" fill="#F3EDE3"/><style>.serif{font-family:Georgia,serif;fill:#28332B}.sans{font-family:Arial,sans-serif;fill:#343432}.eye{font-family:Arial,sans-serif;font-size:12px;letter-spacing:2px;fill:#9d5939}.line{stroke:#D2C6B8;stroke-width:1.3}</style><text x="45" y="45" font-size="22" class="serif">JV.  Juan Vistro</text><text x="735" y="45" class="sans" font-size="13">Home     Work     Projects     About     Contact</text><path d="M40 65H1060" class="line"/><text x="48" y="113" class="eye">ABOUT</text><text x="48" y="160" class="serif" font-size="45">The work is technical.</text><text x="48" y="212" class="serif" font-size="45">The responsibility is human.</text><path d="M48 234h55" stroke="#B17750" stroke-width="3"/><text x="50" y="281" class="sans" font-size="17">Software engineer and technical leader, shaped by</text><text x="50" y="309" class="sans" font-size="17">product engineering, nonprofit leadership and community.</text><text x="50" y="351" class="sans" font-size="16">I care whether people understand, trust and can improve</text><text x="50" y="377" class="sans" font-size="16">the systems they depend on.</text><rect x="733" y="100" width="285" height="315" rx="26" fill="#E2E6D9" stroke="#D2C6B8"/><text x="875" y="233" text-anchor="middle" class="sans" font-size="17">Authentic portrait</text><text x="875" y="261" text-anchor="middle" class="sans" font-size="13">Owner to supply</text><path d="M40 451H1060" class="line"/><text x="48" y="491" class="eye">01 / THE PATH HERE</text><text x="48" y="546" class="serif" font-size="36">A career shaped by</text><text x="48" y="587" class="serif" font-size="36">software and community.</text><text x="400" y="531" class="sans" font-size="17">Software development, community organizing,</text><text x="400" y="560" class="sans" font-size="17">nonprofit programs and engineering systems.</text><path d="M50 637H1050" class="line"/><g font-family="Georgia,serif" fill="#28332B" font-size="24"><text x="70" y="690">Community &amp; Programs</text><text x="430" y="690">Product Engineering</text><text x="780" y="690">Systems &amp; Leadership</text></g><path d="M40 736H1060" class="line"/><text x="48" y="774" class="eye">02 / HOW I WORK</text><text x="48" y="828" class="serif" font-size="37">People first.</text><text x="48" y="869" class="serif" font-size="37">Systems second.</text><text x="48" y="910" class="serif" font-size="37">Tools third.</text><circle cx="475" cy="803" r="22" fill="#E6E8DC" stroke="#B17750"/><text x="453" y="851" class="serif" font-size="21">Make tradeoffs visible.</text><text x="453" y="883" class="sans" font-size="13">Explain constraints and decisions.</text><circle cx="680" cy="803" r="22" fill="#E6E8DC" stroke="#B17750"/><text x="658" y="851" class="serif" font-size="21">Build capability.</text><text x="658" y="883" class="sans" font-size="13">Leave teams more capable.</text><circle cx="885" cy="803" r="22" fill="#E6E8DC" stroke="#B17750"/><text x="863" y="851" class="serif" font-size="21">Use automation wisely.</text><text x="863" y="883" class="sans" font-size="13">Preserve human judgment.</text><path d="M40 955H1060" class="line"/><text x="48" y="996" class="eye">03 / WHAT I'M BUILDING</text><text x="48" y="1046" class="serif" font-size="34">At the intersection</text><text x="48" y="1085" class="serif" font-size="34">of technology and</text><text x="48" y="1124" class="serif" font-size="34">organizational needs.</text><rect x="460" y="1005" width="278" height="160" rx="13" fill="#F7F1E8" stroke="#D2C6B8"/><rect x="756" y="1005" width="275" height="160" rx="13" fill="#F7F1E8" stroke="#D2C6B8"/><text x="480" y="1045" class="serif" font-size="25">Impact Innovations</text><text x="480" y="1075" class="sans" font-size="14">Nonprofit technology strategy</text><text x="775" y="1045" class="serif" font-size="25">Asterism</text><text x="775" y="1075" class="sans" font-size="14">Independent engineering projects</text><path d="M40 1215H1060" class="line"/><text x="48" y="1254" class="eye">04 / WHAT'S NEXT</text><text x="48" y="1310" class="serif" font-size="36">Growing into broader</text><text x="48" y="1350" class="serif" font-size="36">engineering leadership.</text><text x="500" y="1310" class="sans" font-size="16">Technical depth with responsibility for people,</text><text x="500" y="1336" class="sans" font-size="16">delivery and organizational outcomes.</text><rect x="40" y="1430" width="1020" height="160" rx="18" fill="#28332B"/><text x="78" y="1526" font-family="Georgia,serif" font-size="43" fill="#F3EDE3">Let's connect.</text><text x="500" y="1510" font-family="Arial,sans-serif" font-size="16" fill="#F3EDE3">Engineering leadership, strategy and technology.</text><rect x="858" y="1490" width="155" height="55" rx="7" fill="#F3EDE3"/><text x="883" y="1525" class="sans" font-size="16">Get in touch →</text><path d="M40 1634H1060" class="line"/><text x="48" y="1679" class="sans" font-size="13">© 2026 Juan Vistro</text><text x="810" y="1679" class="sans" font-size="13">Considered systems. Human perspective.</text></svg>